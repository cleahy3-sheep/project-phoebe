<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoebe's Calendar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      margin: 0;
      padding: 18px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 5px 0 18px 0;
    }

    .day {
      border: 2px solid black;
      padding: 12px 15px;
      margin-bottom: 12px;
    }

    .today {
      border: 5px solid black;
    }

    .day-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .parent {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .detail {
      font-size: 21px;
      line-height: 1.35;
    }

    .event {
      font-size: 22px;
      font-weight: bold;
      margin-top: 7px;
      line-height: 1.3;
    }
  </style>
</head>

<body>

<h1>Phoebe's Calendar</h1>

<div id="calendar"></div>

<script>
(function () {

  var dayNames = [
    "SUNDAY",
    "MONDAY",
    "TUESDAY",
    "WEDNESDAY",
    "THURSDAY",
    "FRIDAY",
    "SATURDAY"
  ];

  function startOfDay(date) {
    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );
  }

  function daysBetween(a, b) {
    var oneDay = 24 * 60 * 60 * 1000;

    return Math.round(
      (startOfDay(a).getTime() - startOfDay(b).getTime()) / oneDay
    );
  }

  function parentForDate(date) {
    var day = date.getDay();

    /* Monday + Tuesday */
    if (day === 1 || day === 2) {
      return "Mommy";
    }

    /* Wednesday + Thursday */
    if (day === 3 || day === 4) {
      return "Mama";
    }

    /* Friday-Sunday alternating weekend */
    var friday = new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

    if (day === 6) {
      friday.setDate(friday.getDate() - 1);
    }

    if (day === 0) {
      friday.setDate(friday.getDate() - 2);
    }

    /* August 14, 2026 = start of a Mommy weekend */
    var anchorFriday = new Date(2026, 7, 14);

    var difference = daysBetween(friday, anchorFriday);
    var weekendNumber = Math.round(difference / 7);

    if (Math.abs(weekendNumber % 2) === 0) {
      return "Mommy";
    }

    return "Mama";
  }

  function titleForOffset(offset, date) {
    if (offset === -1) {
      return "YESTERDAY";
    }

    if (offset === 0) {
      return "TODAY";
    }

    if (offset === 1) {
      return "TOMORROW";
    }

    return dayNames[date.getDay()];
  }

  function makeDate(base, offset) {
    var date = new Date(
      base.getFullYear(),
      base.getMonth(),
      base.getDate()
    );

    date.setDate(date.getDate() + offset);

    return date;
  }

  function twoDigits(number) {
    if (number < 10) {
      return "0" + number;
    }

    return "" + number;
  }

  function dateKey(date) {
    return (
      date.getFullYear() +
      "-" +
      twoDigits(date.getMonth() + 1) +
      "-" +
      twoDigits(date.getDate())
    );
  }

  function renderCalendar(events) {

    var today = new Date();
    var calendar = document.getElementById("calendar");

    calendar.innerHTML = "";

    /* Yesterday + Today + five future days */
    for (var offset = -1; offset <= 5; offset++) {

      var date = makeDate(today, offset);
      var previousDate = makeDate(date, -1);

      var parent = parentForDate(date);
      var previousParent = parentForDate(previousDate);

      var box = document.createElement("div");

      if (offset === 0) {
        box.className = "day today";
      } else {
        box.className = "day";
      }

      var title = document.createElement("div");
      title.className = "day-title";
      title.appendChild(
        document.createTextNode(
          titleForOffset(offset, date)
        )
      );

      box.appendChild(title);

      if (parent === previousParent) {

        var parentLine = document.createElement("div");
        parentLine.className = "parent";
        parentLine.appendChild(
          document.createTextNode(parent)
        );

        box.appendChild(parentLine);

      } else {

        var wake = document.createElement("div");
        wake.className = "detail";
        wake.appendChild(
          document.createTextNode(
            "Wake up with " + previousParent
          )
        );

        box.appendChild(wake);

        var sleep = document.createElement("div");
        sleep.className = "parent";
        sleep.appendChild(
          document.createTextNode(
            "Sleep with " + parent
          )
        );

        box.appendChild(sleep);
      }

      var key = dateKey(date);

      if (events[key]) {

        for (var i = 0; i < events[key].length; i++) {

          var eventLine = document.createElement("div");
          eventLine.className = "event";

          eventLine.appendChild(
            document.createTextNode(events[key][i])
          );

          box.appendChild(eventLine);
        }
      }

      calendar.appendChild(box);
    }
  }

  /*
    Use an old-style request because it is more compatible
    with the Kobo's browser than modern fetch().
  */
  var request = new XMLHttpRequest();

  request.onreadystatechange = function () {

    if (request.readyState === 4) {

      if (request.status === 200) {

        try {
          var events = JSON.parse(request.responseText);
          renderCalendar(events);

        } catch (error) {
          renderCalendar({});
        }

      } else {
        renderCalendar({});
      }
    }
  };

  /*
    The number on the end helps stop the Kobo
    from showing an old cached copy of events.json.
  */
  request.open(
    "GET",
    "events.json?t=" + new Date().getTime(),
    true
  );

  request.send();

})();
</script>

</body>
</html>
