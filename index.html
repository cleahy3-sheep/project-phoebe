<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Phoebe's Calendar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      margin: 0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 4px 0 16px 0;
    }

    .day {
      border: 2px solid black;
      padding: 11px 14px;
      margin-bottom: 10px;
    }

    .today {
      border: 5px solid black;
    }

    .day-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .parent {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.25;
    }

    .transition {
      font-size: 21px;
      line-height: 1.35;
    }

    .sleep {
      font-size: 23px;
      font-weight: bold;
      line-height: 1.35;
    }

    .event {
      font-size: 22px;
      margin-top: 6px;
      line-height: 1.3;
    }
  </style>
</head>

<body>

<h1>Phoebe's Calendar</h1>

<div id="calendar"></div>

<script>
(function () {

  var dayNames = [
    "SUNDAY",
    "MONDAY",
    "TUESDAY",
    "WEDNESDAY",
    "THURSDAY",
    "FRIDAY",
    "SATURDAY"
  ];

  function startOfDay(date) {
    return new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );
  }

  function daysBetween(a, b) {
    var oneDay = 24 * 60 * 60 * 1000;

    return Math.round(
      (startOfDay(a).getTime() - startOfDay(b).getTime()) / oneDay
    );
  }

  function makeDate(base, offset) {
    var date = new Date(
      base.getFullYear(),
      base.getMonth(),
      base.getDate()
    );

    date.setDate(date.getDate() + offset);
    return date;
  }

  function parentForDate(date) {
    var day = date.getDay();

    /* Monday and Tuesday */
    if (day === 1 || day === 2) {
      return "Mommy";
    }

    /* Wednesday and Thursday */
    if (day === 3 || day === 4) {
      return "Mama";
    }

    /*
      Friday, Saturday and Sunday are one alternating weekend block.

      Friday August 14, 2026 starts a Mommy weekend.
    */

    var friday = new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

    if (day === 6) {
      friday.setDate(friday.getDate() - 1);
    }

    if (day === 0) {
      friday.setDate(friday.getDate() - 2);
    }

    var anchorFriday = new Date(2026, 7, 14);

    var difference = daysBetween(friday, anchorFriday);
    var weekendNumber = Math.round(difference / 7);

    if (Math.abs(weekendNumber % 2) === 0) {
      return "Mommy";
    }

    return "Mama";
  }

  function titleForOffset(offset, date) {
    if (offset === -1) {
      return "YESTERDAY";
    }

    if (offset === 0) {
      return "TODAY";
    }

    if (offset === 1) {
      return "TOMORROW";
    }

    return dayNames[date.getDay()];
  }

  function twoDigits(number) {
    if (number < 10) {
      return "0" + number;
    }

    return "" + number;
  }

  function dateKey(date) {
    return (
      date.getFullYear() +
      "-" +
      twoDigits(date.getMonth() + 1) +
      "-" +
      twoDigits(date.getDate())
    );
  }

  function addText(parent, className, text) {
    var line = document.createElement("div");

    line.className = className;

    line.appendChild(
      document.createTextNode(text)
    );

    parent.appendChild(line);
  }

  function renderCalendar(events) {

    var calendar = document.getElementById("calendar");
    var today = new Date();

    calendar.innerHTML = "";

    /*
      Rolling seven-day view:
      Yesterday + Today + five upcoming days
    */

    for (var offset = -1; offset <= 5; offset++) {

      var date = makeDate(today, offset);
      var previousDate = makeDate(date, -1);

      var parent = parentForDate(date);
      var previousParent = parentForDate(previousDate);

      var box = document.createElement("div");

      if (offset === 0) {
        box.className = "day today";
      } else {
        box.className = "day";
      }

      addText(
        box,
        "day-title",
        titleForOffset(offset, date)
      );

      /*
        If Phoebe stays with the same parent,
        just show Mama or Mommy.

        If the parent changes that day,
        show wake-up and sleep information instead.
      */

      if (parent === previousParent) {

        addText(
          box,
          "parent",
          parent
        );

      } else {

        addText(
          box,
          "transition",
          "Wake up with " + previousParent
        );

        addText(
          box,
          "sleep",
          "Sleep with " + parent
        );
      }

      /*
        Custom events from events.json
      */

      var key = dateKey(date);

      if (events[key]) {

        for (var i = 0; i < events[key].length; i++) {

          addText(
            box,
            "event",
            events[key][i]
          );
        }
      }

      calendar.appendChild(box);
    }
  }

  /*
    Load events.json.

    The changing number forces the Kobo to ask
    for a fresh copy instead of using an old one.
  */

  var request = new XMLHttpRequest();

  request.onreadystatechange = function () {

    if (request.readyState === 4) {

      if (request.status === 200) {

        try {

          renderCalendar(
            JSON.parse(request.responseText)
          );

        } catch (error) {

          renderCalendar({});
        }

      } else {

        renderCalendar({});
      }
    }
  };

  request.open(
    "GET",
    "events.json?v=" + new Date().getTime(),
    true
  );

  request.send();

})();
</script>

</body>
</html>
