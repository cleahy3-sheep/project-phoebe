<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoebe's Calendar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      margin: 0;
      padding: 24px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin: 5px 0 25px 0;
    }

    .day {
      border: 2px solid black;
      padding: 16px;
      margin-bottom: 18px;
    }

    .day-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .today {
      border: 5px solid black;
    }

    .event {
      font-size: 25px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<h1>Phoebe's Calendar</h1>

<div class="day">
  <div class="day-title">YESTERDAY</div>
  <div class="event">Mama</div>
  <div class="event">🛝 Playground</div>
</div>

<div class="day today">
  <div class="day-title">TODAY</div>
  <div class="event">Mommy</div>
  <div class="event">🏊 Swimming</div>
  <div class="event">Sleep with Mommy</div>
</div>

<div class="day">
  <div class="day-title">TOMORROW</div>
  <div class="event">Mama</div>
  <div class="event">Grandma ❤️</div>
</div>

<div class="day">
  <div class="day-title">MONDAY</div>
  <div class="event">Mama</div>
</div>

<div class="day">
  <div class="day-title">TUESDAY</div>
  <div class="event">Mommy</div>
  <div class="event">Dentist 🦷</div>
</div>

</body>
</html>
